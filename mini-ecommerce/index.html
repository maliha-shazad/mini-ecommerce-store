<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Mini Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <nav class="navbar container">
        <a href="index.html" class="logo">Shop<span>Ease</span></a>

        <div class="nav-links">
            <a href="index.html">Products</a>
            <a href="cart.html">
                Cart <span class="cart-count">0</span>
            </a>
        </div>
    </nav>
</header>

<main>

    <section class="hero">
        <div class="container hero-content">
            <div>
                <p class="hero-tag">WELCOME TO SHOPEASE</p>
                <h1>Find products you'll love.</h1>
                <p>
                    Browse our collection, discover your favorites,
                    and shop with ease.
                </p>
                <a href="#products" class="btn">Shop Now</a>
            </div>
        </div>
    </section>

    <section class="products-section container" id="products">

        <div class="section-heading">
            <div>
                <p class="small-title">OUR PRODUCTS</p>
                <h2>Explore Products</h2>
            </div>
        </div>

        <div class="filters">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >
            </div>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>

            <select id="sortFilter">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
            </select>

        </div>

        <div id="productsGrid" class="products-grid">
            <div class="loader">Loading products...</div>
        </div>

    </section>

</main>

<div id="toast" class="toast"></div>

<script src="js/shared.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>

</body>
</html>
